<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-body-tertiary">

  <!-- 1. Navbar -->
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand fw-semibold">Expense Tracker</span>
      <!-- Bonus: switch between light and dark mode -->
      <button type="button" id="theme-button" class="btn btn-sm btn-outline-light">Dark mode</button>
    </div>
  </nav>

  <main class="container pb-5">

    <!-- Alerts (success and error messages) are added here by JavaScript -->
    <div id="alert-box"></div>

    <!-- 2. Summary cards (they always count ALL the expenses, not the filtered list).
         The layout of the 4 cards uses CSS Grid (see .summary-grid in style.css). -->
    <div class="summary-grid mb-4">
      <div class="card shadow-sm text-center">
        <div class="card-body">
          <p class="text-body-secondary small mb-1">Total</p>
          <p id="total-amount" class="fs-3 fw-bold mb-0">0.00</p>
        </div>
      </div>
      <div class="card shadow-sm text-center">
        <div class="card-body">
          <p class="text-body-secondary small mb-1">Number of expenses</p>
          <p id="expense-count" class="fs-3 fw-bold mb-0">0</p>
        </div>
      </div>
      <div class="card shadow-sm text-center">
        <div class="card-body">
          <p class="text-body-secondary small mb-1">Highest expense</p>
          <p id="highest-amount" class="fs-3 fw-bold mb-0">0.00</p>
          <p id="highest-title" class="text-body-secondary small mb-0">-</p>
        </div>
      </div>
      <div class="card shadow-sm text-center">
        <div class="card-body">
          <p class="text-body-secondary small mb-1">Average expense</p>
          <p id="average-amount" class="fs-3 fw-bold mb-0">0.00</p>
        </div>
      </div>
    </div>

    <!-- Bonus: chart of spending by category (Chart.js). Like the cards, it uses ALL the expenses. -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h2 class="h5 mb-3">Spending by category</h2>
        <div class="chart-box">
          <canvas id="category-chart" aria-label="Chart of spending by category" role="img"></canvas>
        </div>
        <p id="chart-empty" class="text-center text-body-secondary py-4 mb-0 d-none">No data to show yet.</p>
      </div>
    </div>

    <!-- 3. Form to add an expense -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h2 class="h5 mb-3">Add expense</h2>

        <!-- novalidate: we check the fields ourselves in app.js and show our own messages -->
        <form id="add-form" novalidate>
          <div class="row g-3">
            <div class="col-12 col-md-6 col-lg-3">
              <label for="add-title" class="form-label">Title</label>
              <input type="text" id="add-title" class="form-control" maxlength="100" placeholder="e.g. Lunch">
              <div class="invalid-feedback"></div>
            </div>

            <div class="col-12 col-md-6 col-lg-3">
              <label for="add-amount" class="form-label">Amount</label>
              <input type="number" id="add-amount" class="form-control" min="0.01" step="0.01" placeholder="e.g. 4.50">
              <div class="invalid-feedback"></div>
            </div>

            <div class="col-12 col-md-6 col-lg-3">
              <label for="add-category" class="form-label">Category</label>
              <select id="add-category" class="form-select">
                <option value="">Choose...</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
              <div class="invalid-feedback"></div>
            </div>

            <div class="col-12 col-md-6 col-lg-3">
              <label for="add-date" class="form-label">Date</label>
              <input type="date" id="add-date" class="form-control">
              <div class="invalid-feedback"></div>
            </div>
          </div>

          <button type="submit" id="add-button" class="btn btn-primary mt-3">Add expense</button>
        </form>
      </div>
    </div>

    <!-- 4. Filter + 5. Table -->
    <div class="card shadow-sm">
      <div class="card-body">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
          <h2 class="h5 mb-0">Expenses</h2>
          <div class="d-flex flex-wrap align-items-center gap-2">
            <!-- Bonus: search by title -->
            <label for="search-title" class="visually-hidden">Search by title</label>
            <input type="search" id="search-title" class="form-control form-control-sm search-input" placeholder="Search by title">

            <label for="filter-category" class="form-label mb-0 small text-body-secondary">Category</label>
            <select id="filter-category" class="form-select form-select-sm filter-select">
              <option value="All">All</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other">Other</option>
            </select>

            <!-- Bonus: download the expenses shown in the table as a CSV file (opens in Excel) -->
            <button type="button" id="export-button" class="btn btn-sm btn-outline-success">Export CSV</button>
          </div>
        </div>

        <!-- Spinner: shown while the data loads -->
        <div id="spinner" class="text-center py-5 d-none">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>

        <div id="table-wrapper" class="table-responsive">
          <table class="table table-striped table-hover align-middle mb-0">
            <thead>
              <tr>
                <th>Title</th>
                <th class="text-end">Amount</th>
                <th>Category</th>
                <th>Date</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <!-- The rows are built with JavaScript (DOM), not written here -->
            <tbody id="expense-table-body"></tbody>
          </table>
        </div>
      </div>
    </div>

  </main>

  <!-- Edit modal (Bootstrap): filled with the current data when you click "Edit" -->
  <div class="modal fade" id="edit-modal" tabindex="-1" aria-labelledby="edit-modal-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <form id="edit-form" novalidate>
          <div class="modal-header">
            <h2 class="modal-title h5" id="edit-modal-title">Edit expense</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>

          <div class="modal-body">
            <!-- The id of the expense we are editing (the user does not see it) -->
            <input type="hidden" id="edit-id">

            <div class="mb-3">
              <label for="edit-title" class="form-label">Title</label>
              <input type="text" id="edit-title" class="form-control" maxlength="100">
              <div class="invalid-feedback"></div>
            </div>

            <div class="mb-3">
              <label for="edit-amount" class="form-label">Amount</label>
              <input type="number" id="edit-amount" class="form-control" min="0.01" step="0.01">
              <div class="invalid-feedback"></div>
            </div>

            <div class="mb-3">
              <label for="edit-category" class="form-label">Category</label>
              <select id="edit-category" class="form-select">
                <option value="">Choose...</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
              <div class="invalid-feedback"></div>
            </div>

            <div class="mb-3">
              <label for="edit-date" class="form-label">Date</label>
              <input type="date" id="edit-date" class="form-control">
              <div class="invalid-feedback"></div>
            </div>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" id="save-button" class="btn btn-primary">Save changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Chart.js: draws the chart (bonus) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
